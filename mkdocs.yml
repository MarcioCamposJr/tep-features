site_name: tepfeatures
site_description: Feature extraction for TMS-Evoked Potentials (TEPs)
theme:
  name: material
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_root_heading: true
            show_source: true

nav:
  - Home: index.md
  - API Reference:
    - Core Extractor: api/core.md
    - Temporal Features: api/temporal.md
    - Spatial Features: api/spatial.md
    - Microstate Features: api/microstates.md
    - Spectral Features: api/spectral.md
