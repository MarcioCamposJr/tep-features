[project]
name = "tepfeatures"
version = "0.1.0"
description = "A Python library for extracting features from TMS-Evoked Potentials (TEPs) using EEG data."
readme = "README.md"
authors = [
    { name = "Márcio Campos", email = "marcio.campos6@gmail.com" }
]
license = { text = "MIT" }
keywords = ["EEG", "TMS", "TEP", "Neuroinformatics", "Feature Extraction", "MNE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.12"
dependencies = [
    "mne>=1.12.1",
    "pandas>=3.0.5",
]

[dependency-groups]
dev = [
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]
